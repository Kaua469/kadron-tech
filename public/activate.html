<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ativação de E-mail</title>
</head>
<body style="font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #111; color: white;">
    <div style="text-align: center; background: #222; padding: 40px; border-radius: 8px;">
        <h2>Ativação do E-mail</h2>
        <p>Clique no botão abaixo para enviar o primeiro teste e receber o e-mail de ativação.</p>
        <form action="https://formsubmit.co/kadron.tech@gmail.com" method="POST">
            <input type="hidden" name="Ativação" value="Este é um email de teste para ativação.">
            <button type="submit" style="background-color: #DC2626; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 4px; cursor: pointer;">
                Enviar Teste de Ativação
            </button>
        </form>
    </div>
</body>
</html>
